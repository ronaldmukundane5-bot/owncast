# fly.toml app configuration file generated for god-of-wonders-fm on 2026-10-18T07:18:13Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'god-of-wonders-fm'
primary_region = 'jnb'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
[[services]]
  internal_port = 1935
  protocol = "tcp"
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 0
  processes = [ "app" ]

  [[services.ports]]
    port = 1935